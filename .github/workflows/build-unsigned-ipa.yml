name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Test gateway contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/gateway
        run: python3 -m unittest discover -s gateway/tests -v

      - name: Test iOS gateway decoding
        run: |
          xcrun swiftc Rabotyaga/GatewayModels.swift scripts/DecoderSmoke.swift -o /tmp/rabotyaga-decoder-smoke
          /tmp/rabotyaga-decoder-smoke

      - name: Build unsigned IPA
        run: bash scripts/build_unsigned_ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Rabotyaga-unsigned
          path: build/Rabotyaga-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

